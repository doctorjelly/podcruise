name: quality

on:
  push:
  pull_request:

jobs:
  metadata-only-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and host C check
        run: make test
      - name: Confirm no ROM is tracked
        run: python tools/check_repository_safety.py
