name: Star Wars Episode I Racer (USA retail)
sha1: 3542d5597c8a56ea8f5c63bceae97a24c4c08d58

options:
  basename: podcruise.us
  target_path: "roms/originals/baserom.us.z64"
  elf_path: build/us/podcruise.us.elf
  base_path: ..
  platform: n64

  # Strong family-level hypothesis; exact IDO release/flags remain unconfirmed.
  compiler: IDO

  asm_path: analysis/generated/us/asm
  asset_path: analysis/generated/us/assets
  src_path: src
  build_path: build/us
  cache_path: .cache/splat/us
  generated_asm_macros_directory: analysis/generated/us/include
  ld_script_path: analysis/generated/us/podcruise.us.ld
  ld_dependencies: true

  find_file_boundaries: true
  disassemble_all: true
  header_encoding: ASCII
  o_as_suffix: true
  use_legacy_include_asm: false
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - config/us/symbol_addrs.auto.txt
  reloc_addrs_path:
    - config/us/reloc_addrs.txt
  undefined_funcs_auto_path: analysis/generated/us/undefined_funcs_auto.txt
  undefined_syms_auto_path: analysis/generated/us/undefined_syms_auto.txt

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  # Bootstrap interval validated against the static-recomp observation. It is
  # deliberately coarse and includes material still to classify as CPU code,
  # data, or RSP microcode.
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, main]

  - name: remainder
    type: bin
    start: 0x99000
    follows_vram: main

  - [0x2000000]
