name: Star Wars Episode I Racer (Europe retail, En/Fr/De)
sha1: 899a8245da017289c88e97327fdcd6694b770a25

options:
  basename: podcruise.eu
  target_path: "roms/originals/baserom.eu.z64"
  elf_path: build/eu/podcruise.eu.elf
  base_path: ..
  platform: n64
  compiler: IDO

  asm_path: analysis/generated/eu/asm
  asset_path: analysis/generated/eu/assets
  src_path: src
  build_path: build/eu
  cache_path: .cache/splat/eu
  generated_asm_macros_directory: analysis/generated/eu/include
  ld_script_path: analysis/generated/eu/podcruise.eu.ld
  ld_dependencies: true

  find_file_boundaries: true
  disassemble_all: true
  header_encoding: ASCII
  o_as_suffix: true
  use_legacy_include_asm: false
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - config/eu/symbol_addrs.auto.txt
  reloc_addrs_path:
    - config/eu/reloc_addrs.txt
  undefined_funcs_auto_path: analysis/generated/eu/undefined_funcs_auto.txt
  undefined_syms_auto_path: analysis/generated/eu/undefined_syms_auto.txt

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, main]

  # USA bootstrap endpoint translated by the final stable EU delta (+0x5550).
  - name: remainder
    type: bin
    start: 0x9E550
    follows_vram: main

  - [0x2000000]
